<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>ポートフォリオ(西田辰馬）</title>
    <link  rel="stylesheet" href="style.css">

</head>

<body>
    <header>
    <h1>西田 辰馬</h1>
    <p>webエンジニアを目指して</p>
    </header>

    <main>
    <section>
    <h2>自己紹介</h2>
    <p>未経験からwebエンジニアを目指して、HTML,CSS,JabaScriptを学習しています。</p>
    </section>

    <section>
    <h2>スキル</h2>
    <ul>
    <li>HTML</li>
    <li>CSS</li>
    <li>JavaScript</li>
    </ul>
    </section>

    <section>
    <h2>制作物</h2>
    <div class="project">
    <h3>Todoアプリ</h3>
    <p>タスクの追加・削除・完了状態の切り替え・保存が出来るTodoアプリです。</p>
    <p>タスクをクリックすると完了状態を切り替えられます。</p>
    <input id="todoInput" type="text"placeholder="タスクを入力">
    <button id="addTodo">追加</button>
    <ul id="todoList"></ul>
    </div>
    </section>

    <section>
    <h2>お問い合わせ</h2>
    <button id="contactButton">お問い合わせ</button>
    <p id="contactMessage">お問い合わせはGitHubからお願いします。</p>
    </section>
    </main>

<script src="main.js"> </script>

</body>

</html>
